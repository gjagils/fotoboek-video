<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Onze films van Thailand — Verdonk & Van Gils, 2026.">
  <title>Onze Thailand Films</title>
  <link rel="stylesheet" href="thailand-films.css">
</head>
<body>
  <header class="travel-hero">
    <img class="travel-hero__art" src="assets/thailand-header-decoration.svg" alt="" aria-hidden="true">
    <div class="travel-hero__title-strip">
      <p class="travel-hero__eyebrow">Reisfilmarchief · Zuidoost-Azië</p>
      <h1>Onze Thailand Films</h1>
      <p class="travel-hero__subtitle">Thailand · Verdonk &amp; Van Gils · 2026</p>
    </div>
  </header>

  <main class="travel-main">
    <section aria-labelledby="thailand-label">
      <div class="section-label" id="thailand-label">
        <span aria-hidden="true">✦</span> Thailand <span aria-hidden="true">✦</span>
      </div>

      <div class="film-grid">
        <!--
          Vervang per kaart de href door de echte videolink, de img src door de
          thumbnail en de titel door de leesbare filmtitel. De classes portrait
          en landscape zijn alleen voor de mock-up; de beeldverhouding blijft
          altijd die van de thumbnail zelf.
        -->
        <article class="film-card landscape">
          <a class="film-card__link" href="#river-kwai" aria-label="Bekijk The River Kwai">
            <div class="film-card__image-wrap">
              <img src="assets/mock-river-kwai.svg" alt="Boot op de River Kwai" width="800" height="500">
              <span class="film-card__play" aria-hidden="true"><span></span></span>
            </div>
            <h2><span class="film-card__icon" aria-hidden="true">▶</span> The River Kwai</h2>
          </a>
        </article>

        <article class="film-card portrait">
          <a class="film-card__link" href="#santichon" aria-label="Bekijk Santichon Village — Schommel">
            <div class="film-card__image-wrap">
              <img src="assets/mock-santichon.svg" alt="Schommel tussen de bergen van Santichon Village" width="500" height="800">
              <span class="film-card__play" aria-hidden="true"><span></span></span>
            </div>
            <h2><span class="film-card__icon" aria-hidden="true">▶</span> Santichon Village — Schommel</h2>
          </a>
        </article>

        <article class="film-card landscape">
          <a class="film-card__link" href="#bangkok" aria-label="Bekijk Fietsen in Bangkok">
            <div class="film-card__image-wrap">
              <img src="assets/mock-bangkok-bike.svg" alt="Fietsen door de straten van Bangkok" width="800" height="500">
              <span class="film-card__play" aria-hidden="true"><span></span></span>
            </div>
            <h2><span class="film-card__icon" aria-hidden="true">▶</span> Fietsen in Bangkok</h2>
          </a>
        </article>

        <article class="film-card landscape">
          <a class="film-card__link" href="#night-train" aria-label="Bekijk De nachttrein naar Chiang Mai">
            <div class="film-card__image-wrap">
              <img src="assets/mock-night-train.svg" alt="Nachttrein richting Chiang Mai" width="800" height="500">
              <span class="film-card__play" aria-hidden="true"><span></span></span>
            </div>
            <h2><span class="film-card__icon" aria-hidden="true">▶</span> De nachttrein naar Chiang Mai</h2>
          </a>
        </article>

        <article class="film-card portrait">
          <a class="film-card__link" href="#longtail" aria-label="Bekijk Met de longtailboot">
            <div class="film-card__image-wrap">
              <img src="assets/mock-longtail.svg" alt="Longtailboot op groen water" width="500" height="800">
              <span class="film-card__play" aria-hidden="true"><span></span></span>
            </div>
            <h2><span class="film-card__icon" aria-hidden="true">▶</span> Met de longtailboot</h2>
          </a>
        </article>
      </div>
    </section>
  </main>

  <footer class="travel-footer">
    <p>Verdonk &amp; Van Gils · Thailand 2026</p>
  </footer>
</body>
</html>
